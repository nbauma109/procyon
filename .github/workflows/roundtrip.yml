name: Decompiler round trip

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: roundtrip-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decompiler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      projects: ${{ steps.projects.outputs.names }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Test the pipeline
        run: python3 -m unittest discover -s roundtrip -v

      - name: List the projects
        id: projects
        run: echo "names=$(jq -c 'keys' roundtrip/projects.json)" >> "${GITHUB_OUTPUT}"

      - name: Build the decompiler
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :Procyon.Decompiler:jar

      - name: Share the decompiler
        uses: actions/upload-artifact@v4
        with:
          name: decompiler
          path: build/Procyon.Decompiler/libs/procyon-decompiler-*.jar
          if-no-files-found: error

  # One job per project of roundtrip/projects.json, all running in parallel.
  round-trip:
    needs: decompiler
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.decompiler.outputs.projects) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Cache the project dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: roundtrip-m2-${{ matrix.project }}-${{ hashFiles('roundtrip/projects.json') }}
          restore-keys: roundtrip-m2-${{ matrix.project }}-

      - name: Fetch the decompiler
        uses: actions/download-artifact@v4
        with:
          name: decompiler
          path: decompiler

      - name: Run the round trip
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          jar="$(find decompiler -name 'procyon-decompiler-*.jar' | head -n 1)"
          # Maven Central may answer "429 Too Many Requests" to the parallel jobs: try again later.
          for attempt in 1 2 3; do
            # Bisection takes hours on projects with many regressions: run it locally.
            if python3 roundtrip/roundtrip.py "${PROJECT}" --jar "${jar}" --no-bisect --test-timeout 900; then
              exit 0
            fi
            if (( attempt < 3 )); then
              # Maven remembers failed downloads and would not try them again.
              find ~/.m2/repository -name '*.lastUpdated' -delete 2>/dev/null || true
              sleep $(( attempt * 120 ))
            fi
          done
          exit 1

      - name: Summarize
        if: always()
        run: |
          if [[ -f build/roundtrip/report.md ]]; then
            head -c 1000000 build/roundtrip/report.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-${{ matrix.project }}
          path: |
            build/roundtrip/report.md
            build/roundtrip/*/report.json
            build/roundtrip/*/logs/
            build/roundtrip/*/decompiled/
          if-no-files-found: ignore
